name: Vantage Automated Quality & Release Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # 1. Repository & Security Quality Gate
  # --------------------------------------------------------------------------
  release-verification-and-security:
    name: Release Gate & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend requirements
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute automated release quality gate
        run: |
          python scripts/verify_release.py

      - name: Execute incident readiness check
        run: |
          python scripts/incident_readiness.py

  # --------------------------------------------------------------------------
  # 2. Backend Quality Gate (Unit, Ingestion, ML, LLM, Ops Tests)
  # --------------------------------------------------------------------------
  backend-quality-gate:
    name: Backend Pytest Suite & Probes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax and compilation
        run: |
          python -m compileall app/ tests/

      - name: Run full backend pytest suite
        env:
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: test
          EMBEDDING_PROVIDER: mock
          LLM_PROVIDER: mock
        run: |
          pytest -v

  # --------------------------------------------------------------------------
  # 3. Frontend Quality Gate (TypeScript, Lint & Next.js Build)
  # --------------------------------------------------------------------------
  frontend-quality-gate:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  # --------------------------------------------------------------------------
  # 4. End-to-End Deterministic Integration Gate
  # --------------------------------------------------------------------------
  e2e-integration-gate:
    name: End-to-End Deterministic Pipeline Gate
    runs-on: ubuntu-latest
    needs: [backend-quality-gate, frontend-quality-gate]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute End-to-End Pipeline Integration Test
        env:
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: test
          EMBEDDING_PROVIDER: mock
          LLM_PROVIDER: mock
        run: |
          pytest tests/test_e2e_pipeline.py -v
